[package]
  cjc-version = "1.0.5"
  name = "jansi"
  description = "nothing here"
  version = "1.0.0"
  src-dir = "src"
  target-dir = "target"
  output-type = "static"
  compile-option = "-Woff unused --error-count-limit all"
  override-compile-option = ""
  link-option = "-lstdx.net.http -lstdx.net.tls -lstdx.net.tlsFFI -lstdx.net -lstdx.log -lstdx.logger -lstdx.encoding.json.stream -lstdx.encoding.json -lstdx.serialization.serialization"
  package-configuration = {}

[dependencies]
charset4cj = { git = "https://gitcode.com/Cangjie-TPC/charset4cj.git" }

[target.x86_64-unknown-linux-gnu]
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = ["/home/lin/Downloads/cangjie-sdk-linux-x64-1.0.5/cangjie/linux_x86_64_cjnative/static/stdx"]
